<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07130f">
<meta name="description" content="Kalos: an interactive literary childhood chronicle.">
<title>Kalos — The Last Warm Water</title>
<style>
html,body{margin:0;min-height:100%;background:#06110e;color:#f4efe4;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{min-height:100svh;display:grid;place-items:center;padding:28px;text-align:center}.card{max-width:620px;border:1px solid #314840;border-radius:24px;background:#0e211b;padding:26px;box-shadow:0 26px 90px rgba(0,0,0,.38)}h1{font-family:Georgia,"Times New Roman",serif;font-weight:500;margin:.2em 0 .45em;font-size:clamp(2.1rem,8vw,4rem)}p{color:#d7d6cc;line-height:1.6}button{min-height:48px;border:1px solid #526a61;border-radius:14px;padding:10px 16px;background:#132921;color:#f4efe4;font:inherit;font-weight:700}.spinner{width:32px;height:32px;margin:0 auto 16px;border:3px solid #314840;border-top-color:#d4af73;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}
</style>
</head>
<body>
<main><section class="card"><div class="spinner" aria-hidden="true"></div><h1>The Last Warm Water</h1><p id="status">Preparing Kalos’s childhood chronicle…</p><button id="retry" hidden>Try again</button><noscript><p>This interactive chronicle requires JavaScript.</p></noscript></section></main>
<script>
const files=['payload-0.txt','payload-1.txt','payload-2.txt','payload-3.txt'];
async function launch(){const status=document.getElementById('status'),retry=document.getElementById('retry');retry.hidden=true;try{if(!('DecompressionStream'in window))throw new Error('Update iOS/Safari to run this chronicle, or use the downloadable standalone build.');const parts=await Promise.all(files.map(async file=>{const response=await fetch(file+'?v=m01-20260804');if(!response.ok)throw new Error('Could not load the story package.');return response.text()}));const raw=atob(parts.join('')),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();const enriched=html.replace('</body>','<script src="enrichment.js?v=m01-context-20260804"><\/script></body>');document.open();document.write(enriched);document.close()}catch(error){status.textContent=error&&error.message?error.message:String(error);retry.hidden=false}}
document.getElementById('retry').addEventListener('click',launch);launch();
</script>
</body>
</html>
