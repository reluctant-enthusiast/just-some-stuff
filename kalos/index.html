<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07120f">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="refresh" content="0;url=./v2/">
  <title>Kalos — Age Eight</title>
  <style>
    :root{color-scheme:dark;--bg:#07120f;--text:#f3eee3;--muted:#b6beb7;--line:#31463f;--accent:#d7b47a}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#17362e 0,transparent 48%),var(--bg);color:var(--text);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}
    main{width:min(560px,100%);border:1px solid var(--line);border-radius:24px;padding:26px;background:rgba(11,29,24,.92)}
    h1{font:500 clamp(2.2rem,8vw,4.4rem)/.95 Georgia,serif;letter-spacing:-.035em;margin:.2rem 0 1rem}
    p{line-height:1.6;color:var(--muted)}
    a{display:inline-flex;min-height:44px;align-items:center;border:1px solid var(--line);border-radius:12px;background:#10251f;color:var(--text);padding:10px 14px;font-weight:750;text-decoration:none}
  </style>
  <script>location.replace('./v2/');</script>
</head>
<body>
  <main>
    <h1>Opening Kalos</h1>
    <p>The chronicle has moved to the expanded Age Eight build.</p>
    <a href="./v2/">Continue to the story</a>
  </main>
</body>
</html>
