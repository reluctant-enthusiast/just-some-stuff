<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07120f">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Kalos: Age Eight — a living literary childhood chronicle.">
  <title>Kalos — The Last Warm Water</title>
  <style>
    :root{color-scheme:dark;--bg:#07120f;--text:#f3eee3;--muted:#b6beb7;--line:#31463f;--accent:#d7b47a}
    *{box-sizing:border-box}
    html{background:var(--bg);-webkit-text-size-adjust:100%}
    body{margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#17362e 0,transparent 48%),var(--bg);color:var(--text);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}
    main{width:min(560px,100%);border:1px solid var(--line);border-radius:24px;padding:26px;background:rgba(11,29,24,.92);box-shadow:0 24px 80px rgba(0,0,0,.35)}
    .kicker{font-size:.75rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
    h1{font:500 clamp(2.2rem,8vw,4.4rem)/.95 Georgia,serif;letter-spacing:-.035em;margin:.45rem 0 1rem}
    p{line-height:1.6;color:var(--muted)}
    progress{width:100%;height:8px;accent-color:var(--accent)}
    button{min-height:44px;border:1px solid var(--line);border-radius:12px;background:#10251f;color:var(--text);padding:10px 14px;font-weight:750;cursor:pointer}
    button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
  </style>
</head>
<body>
  <main id="status" role="status" aria-live="polite">
    <div class="kicker">Kalos · Age Eight</div>
    <h1>Opening the chronicle</h1>
    <p>Loading the living childhood build…</p>
    <progress aria-label="Loading"></progress>
  </main>
  <script>
    (async () => {
      const status = document.getElementById('status');
      const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (character) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
      try {
        if (!('DecompressionStream' in window)) {
          throw new Error('This browser cannot unpack the story package. Update Safari or use another modern browser.');
        }
        const urls = ['./chunks/00.txt', './chunks/01.txt'];
        const parts = await Promise.all(urls.map(async (url) => {
          const response = await fetch(url, { cache: 'no-store' });
          if (!response.ok) throw new Error(`Could not load ${url} (${response.status}).`);
          return (await response.text()).trim();
        }));
        const encoded = parts.join('');
        const binary = atob(encoded);
        const bytes = new Uint8Array(binary.length);
        for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
        const html = await new Response(stream).text();
        if (!html.startsWith('<!doctype html>')) throw new Error('The story package did not decode correctly.');
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        const message = error instanceof Error ? error.message : String(error);
        status.innerHTML = `<div class="kicker">Kalos · Recovery</div><h1>The chronicle could not open</h1><p>${escapeHtml(message)}</p><button type="button" onclick="location.reload()">Try again</button>`;
      }
    })();
  </script>
</body>
</html>
