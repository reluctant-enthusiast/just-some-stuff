<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071310">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Kalos: The Last Warm Water — an interactive literary childhood chronicle.">
  <title>Kalos — The Last Warm Water</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app" class="app-shell" aria-busy="true">
    <header class="topbar">
      <a class="brand" href="#story" aria-label="Kalos home">
        <span class="brand-mark" aria-hidden="true">K</span>
        <span><strong>Kalos</strong><small>The Last Warm Water</small></span>
      </a>
      <div class="chapter-progress" aria-label="Season progress">
        <span id="progressLabel">Waking</span>
        <div class="progress-track"><span id="progressFill"></span></div>
      </div>
      <nav class="tool-row" aria-label="Chronicle tools">
        <button class="tool-button" data-panel="people" aria-haspopup="dialog">People</button>
        <button class="tool-button" data-panel="memory" aria-haspopup="dialog">Memory</button>
        <button class="tool-button" data-panel="thread" aria-haspopup="dialog">Thread</button>
        <button class="tool-button tool-more" data-panel="more" aria-haspopup="dialog" aria-label="More options">•••</button>
      </nav>
    </header>

    <main id="story" class="stage-layout">
      <section class="visual-stage" aria-label="Scene visualization">
        <div id="sceneArt" class="scene-art" role="img" aria-live="polite"></div>
        <div class="visual-shade"></div>
        <div class="visual-copy">
          <p id="visualEyebrow" class="visual-eyebrow"></p>
          <h1 id="visualTitle"></h1>
          <p id="visualDeck" class="visual-deck"></p>
        </div>
        <div id="visualCues" class="visual-cues" aria-label="Scene cues"></div>
      </section>

      <section class="story-surface">
        <div id="legacyNotice" class="legacy-notice" hidden>
          <div><strong>An earlier chronicle was found.</strong><span>Its durable choices can be carried into this expanded season.</span></div>
          <div class="notice-actions"><button id="migrateLegacy" class="small-action">Carry it forward</button><button id="dismissLegacy" class="small-action subtle">Begin again</button></div>
        </div>

        <div id="sceneMeta" class="scene-meta" aria-label="Scene context"></div>
        <article id="reader" class="reader" aria-live="polite" aria-atomic="true">
          <div class="loading-state">
            <span class="loading-ring" aria-hidden="true"></span>
            <p>Gathering the household before daylight…</p>
          </div>
        </article>
        <section id="choiceRegion" class="choice-region" aria-live="polite"></section>
      </section>
    </main>

    <div id="panelBackdrop" class="panel-backdrop" hidden>
      <aside id="contextPanel" class="context-panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
        <header class="panel-header"><div><p class="panel-kicker">Kalos’s chronicle</p><h2 id="panelTitle">People</h2></div><button id="closePanel" class="close-button" aria-label="Close panel">×</button></header>
        <div id="panelContent" class="panel-content"></div>
      </aside>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <section id="fatalError" class="fatal-error" hidden role="alert">
      <div><p class="panel-kicker">The chronicle stopped unexpectedly</p><h2>The story state could not be rendered.</h2><p id="fatalMessage"></p><div class="error-actions"><button id="recoverState" class="primary-action">Recover saved state</button><button id="resetState" class="secondary-action">Restart the season</button></div></div>
    </section>
  </div>

  <noscript>
    <main class="noscript-fallback">
      <h1>Kalos: The Last Warm Water</h1>
      <p>This chronicle needs JavaScript for branching and persistent memory. Open it in a modern browser with JavaScript enabled.</p>
      <p>Before daylight, eight-year-old Kalos wakes among the bodies and smoke of his household. By the following morning, a damaged hook will place another child beneath an accusation. What comes between those moments decides what the failure means.</p>
    </main>
  </noscript>

  <script type="module" src="./app.js"></script>
</body>
</html>
